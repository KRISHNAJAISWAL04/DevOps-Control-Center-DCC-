services:

  postgres:
    image: postgres:17

    container_name: dcc-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Krishna123
      POSTGRES_DB: dcc

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dcc"]
      interval: 10s
      timeout: 5s
      retries: 5

  dcc:
    build:
      context: .
      dockerfile: app/Dockerfile

    container_name: dcc

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: